name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Выпустить релиз с этим тегом (например v0.1.0); CI сам создаст тег на этом коммите"
        required: false
        default: ""
      skip_tests:
        description: "Только сборка: без тестов, прогона и смоук-тестов"
        type: boolean
        default: false

env:
  # Тег релиза: пуш тега v* или запуск вручную с release_tag.
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  GODOT_VERSION: 4.4.1
  GODOT_RELEASE: stable

jobs:
  build:
    name: Tests and export (Windows, Linux, Steam Deck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-win-linux

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL"
          curl -sSL -o /tmp/templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          # Берём только нужные шаблоны — архив целиком больше гигабайта.
          unzip -qoj /tmp/templates.tpz \
            templates/version.txt \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/windows_release_x86_64_console.exe \
            -d "$TPL"
          rm /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path . --import || true

      - name: Unit tests (GUT)
        if: ${{ !inputs.skip_tests }}
        run: ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit

      - name: Gameplay autotest
        if: ${{ !inputs.skip_tests }}
        run: ~/godot/godot --headless --path . -- --autotest --seed=7

      - name: 3D benchmark (load time and CPU frame time, headless)
        if: ${{ !inputs.skip_tests }}
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --fixed-fps 30 res://proto/preview.tscn -- \
            --seed=14 --auto=bench --mute --bench="$PWD/bench3d.json" | tee bench3d.log
          grep -q "^Загрузка .* мс; кадр" bench3d.log

      - name: UI test (fabricator window and mouse building)
        if: ${{ !inputs.skip_tests }}
        run: xvfb-run -a -s "-screen 0 1600x900x24" ~/godot/godot --path . --rendering-driver opengl3 -- --seed=5 --uitest

      - name: 3D playthrough (menu to next planet by real input, gamepad and keyboard)
        if: ${{ !inputs.skip_tests }}
        run: |
          set -euo pipefail
          for dev in pad keys; do
            timeout 600 xvfb-run -a -s "-screen 0 1280x800x24" ~/godot/godot --path . --rendering-driver opengl3 \
              --resolution 1280x800 -s tools/playthrough.gd -- --$dev --shots="$PWD/playthrough" | tee playthrough_$dev.log
          done

      - name: Export
        run: GODOT=~/godot/godot tools/export.sh

      - name: Smoke-test Linux build
        if: ${{ !inputs.skip_tests }}
        run: build/linux/Pneuma.x86_64 --headless -- --autotest --seed=7

      - name: Smoke-test Steam Deck build (starts in 3D at 1280x800)
        if: ${{ !inputs.skip_tests }}
        run: |
          set -euo pipefail
          timeout 180 xvfb-run -a -s "-screen 0 1280x800x24" build/steamdeck/Pneuma.x86_64 \
            --rendering-driver opengl3 -- --screenshot="$PWD/steamdeck.png" | tee steamdeck.log
          grep -q "Рельеф" steamdeck.log
          test -s steamdeck.png

      - name: Smoke-test Steam Deck main menu
        if: ${{ !inputs.skip_tests }}
        run: |
          set -euo pipefail
          timeout 120 xvfb-run -a -s "-screen 0 1280x800x24" build/steamdeck/Pneuma.x86_64 \
            --rendering-driver opengl3 -- --menu --page=picker --screenshot="$PWD/steamdeck_menu.png" | tee menu.log
          grep -q "Меню: скриншот" menu.log
          test -s steamdeck_menu.png

      - name: Package
        run: |
          set -euo pipefail
          NAME="${RELEASE_TAG:-${GITHUB_REF_NAME//\//-}}"
          mkdir -p dist
          (cd build/windows && zip -q -r "../../dist/Pneuma-${NAME}-windows-x86_64.zip" .)
          tar -C build/linux -czf "dist/Pneuma-${NAME}-linux-x86_64.tar.gz" .
          (cd build/windows3d && zip -q -r "../../dist/Pneuma3D-${NAME}-windows-x86_64.zip" .)
          tar -C build/steamdeck -czf "dist/Pneuma3D-${NAME}-steamdeck.tar.gz" .
          ls -la dist

      # Релиз по тегу v* — прямо из этой задачи, без артефактов Actions
      # (их квота может кончиться, а релиз от неё не зависит).
      - name: GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Pneuma ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md

      - uses: actions/upload-artifact@v4
        with:
          name: Pneuma-windows-x86_64
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: Pneuma-linux-x86_64
          path: build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: Pneuma3D-windows-x86_64
          path: build/windows3d/

      - uses: actions/upload-artifact@v4
        with:
          name: Pneuma3D-steamdeck
          path: dist/Pneuma3D-*-steamdeck.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: steamdeck-screenshot
          path: |
            steamdeck.png
            steamdeck_menu.png

      - uses: actions/upload-artifact@v4
        with:
          name: bench3d
          path: bench3d.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough3d
          path: |
            playthrough/
            playthrough_*.log

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
